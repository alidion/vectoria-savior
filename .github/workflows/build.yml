name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            preset: "Windows Desktop"
            executable: "Vectoria.exe"
            artifact: "Vectoria-Windows"
          - platform: linux
            preset: "Linux/X11"
            executable: "vectoria-savior.x86_64"
            artifact: "Vectoria-Linux"

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1

      - name: Install export templates
        run: |
          godot --headless --editor --export-templates

      - name: Create build directory
        run: mkdir -p Builds

      - name: Export ${{ matrix.preset }}
        run: |
          godot --headless --export-release "${{ matrix.preset }}" "Builds/${{ matrix.executable }}"

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Builds/

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Vectoria-Windows
          path: Vectoria-Windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Vectoria-Linux
          path: Vectoria-Linux

      - name: Zip Windows build
        run: cd Vectoria-Windows && zip -r ../Vectoria-Windows.zip .

      - name: Zip Linux build
        run: cd Vectoria-Linux && zip -r ../Vectoria-Linux.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Vectoria-Windows.zip
            Vectoria-Linux.zip
